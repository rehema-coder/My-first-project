<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order | Baked Daddies</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <nav>

            <h2>Baked Daddies</h2>

            <ul>

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="products.html">Products</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

                <li>
                    <a href="order.html">Order</a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- ================= MAIN CONTENT ================= -->

    <main>

        <!-- Intro Section -->
        <section>

            <h1>Place Your Order</h1>

            <p>
                Fill in the form below to order your favorite snacks.
            </p>

        </section>



        <!-- ================= ORDER FORM ================= -->

        <section>

            <form>

                <!-- Customer Name -->
                <div>

                    <label for="customer-name">
                        Full Name
                    </label>

                    <br><br>

                    <input type="text"
                           id="customer-name"
                           placeholder="Enter your full name">

                </div>

                <br>



                <!-- Phone Number -->
                <div>

                    <label for="phone">
                        Phone Number
                    </label>

                    <br><br>

                    <input type="tel"
                           id="phone"
                           placeholder="Enter your phone number">

                </div>

                <br>



                <!-- Product Selection -->
                <div>

                    <label for="product">
                        Select Product
                    </label>

                    <br><br>

                    <select id="product">

                        <option>
                            Daddies Special
                        </option>

                        <option>
                            Sweet Bites
                        </option>

                        <option>
                            Family Pack
                        </option>

                        <option>
                            Mini Crunch
                        </option>

                    </select>

                </div>

                <br>



                <!-- Quantity -->
                <div>

                    <label for="quantity">
                        Quantity
                    </label>

                    <br><br>

                    <input type="number"
                           id="quantity"
                           min="1"
                           placeholder="Enter quantity">

                </div>

                <br>



                <!-- Delivery Address -->
                <div>

                    <label for="address">
                        Delivery Address
                    </label>

                    <br><br>

                    <textarea id="address"
                              rows="5"
                              cols="40"
                              placeholder="Enter delivery address">
                    </textarea>

                </div>

                <br>



                <!-- Payment Method -->
                <div>

                    <label>
                        Payment Method
                    </label>

                    <br><br>

                    <input type="radio"
                           name="payment">

                    Mobile Money

                    <br><br>

                    <input type="radio"
                           name="payment">

                    Cash on Delivery

                </div>

                <br>



                <!-- Submit Button -->
                <button type="submit">
                    Place Order
                </button>

            </form>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            &copy; 2026 Baked Daddies.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
